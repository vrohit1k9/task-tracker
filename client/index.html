<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandro - Welcome</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      transition: var(--transition-smooth);
    }
    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
      margin-bottom: -2px;
    }
    .auth-section {
      display: none;
    }
    .auth-section.active {
      display: block;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      margin-top: -12px;
      margin-bottom: 20px;
    }
    .theme-switch-container {
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>
<body>
  <!-- Ambient Gradients -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="theme-switch-container">
    <button class="theme-switch" onclick="toggleTheme()" aria-label="Toggle Theme">🌓</button>
  </div>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <img src="images/logo.svg" alt="Sandro Logo" style="width: 60px; height: 60px; border-radius: 14px; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <h1>Sandro</h1>
        <p>Your Ultimate Academic Dashboard</p>
      </div>

      <!-- Tab Buttons -->
      <div class="auth-tabs" id="authTabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- Login Section -->
      <div id="loginSection" class="auth-section active">
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginIdentifier">Username or Email Address</label>
            <input type="text" id="loginIdentifier" class="form-control" placeholder="enter username or school email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-secondary);">
              <input type="checkbox" id="toggleLoginPassword" onclick="togglePasswordVisibility('loginPassword')">
              <label for="toggleLoginPassword" style="cursor: pointer; user-select: none;">Show Password</label>
            </div>
          </div>
          <a href="#" class="forgot-link" onclick="switchTab('forgot')">Forgot Password?</a>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Login to Dashboard
          </button>
        </form>
        <div class="social-auth" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
          <div class="separator" style="display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 0.85rem; margin: 15px 0;">
            <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color); margin-right: 10px;">
            <span>OR CONTINUE WITH</span>
            <hr style="flex: 1; border: none; border-top: 1px solid var(--border-color); margin-left: 10px;">
          </div>
          <div id="googleSignInButtonContainer" style="width: 100%;">
            <button class="btn btn-secondary" onclick="auth.loginWithGoogle()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6-4.53z" fill="#EA4335"/>
              </svg>
              Google Account
            </button>
          </div>
        </div>
      </div>

      <!-- Register Section -->
      <div id="registerSection" class="auth-section">
        <form id="registerForm">
          <div class="form-group">
            <label class="form-label" for="registerUsername">Username</label>
            <input type="text" id="registerUsername" class="form-control" placeholder="choose a display name" required minlength="3">
          </div>
          <div class="form-group">
            <label class="form-label" for="registerEmail">Email Address</label>
            <input type="email" id="registerEmail" class="form-control" placeholder="e.g. name@school.edu" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="registerPassword">Password</label>
            <input type="password" id="registerPassword" class="form-control" placeholder="at least 6 characters" required minlength="6">
            <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-secondary);">
              <input type="checkbox" id="toggleRegisterPassword" onclick="togglePasswordVisibility('registerPassword')">
              <label for="toggleRegisterPassword" style="cursor: pointer; user-select: none;">Show Password</label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="registerRole">Role</label>
            <select id="registerRole" class="form-control">
              <option value="student">Student</option>
              <option value="admin">Teacher / Administrator</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Create Account
          </button>
        </form>
      </div>

      <!-- Forgot Password Section -->
      <div id="forgotSection" class="auth-section">
        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <input type="email" id="forgotEmail" class="form-control" placeholder="enter your account email" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 12px;">
            Send Reset Link
          </button>
          <button type="button" class="btn btn-secondary" style="width: 100%;" onclick="switchTab('login')">
            Back to Login
          </button>
        </form>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Toggle Password Visibility
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
      } else {
        field.type = 'password';
      }
    }

    // Tab controller
    function switchTab(tab) {
      const sections = ['login', 'register', 'forgot'];
      const tabs = document.querySelectorAll('.auth-tab');
      
      sections.forEach(sec => {
        const elem = document.getElementById(`${sec}Section`);
        if (sec === tab) {
          elem.classList.add('active');
        } else {
          elem.classList.remove('active');
        }
      });

      tabs.forEach(tabBtn => {
        if (tabBtn.textContent.toLowerCase() === tab) {
          tabBtn.classList.add('active');
        } else {
          tabBtn.classList.remove('active');
        }
      });

      // Special handling for forgot tab since it's not in the main tab list
      if (tab === 'forgot') {
        tabs.forEach(tabBtn => tabBtn.classList.remove('active'));
      }
    }

    // Bind Forms
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value;
      const pass = document.getElementById('loginPassword').value;
      auth.login(identifier, pass);
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('registerUsername').value;
      const email = document.getElementById('registerEmail').value;
      const pass = document.getElementById('registerPassword').value;
      const role = document.getElementById('registerRole').value;
      auth.register(user, email, pass, role);
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      try {
        const data = await api.post('/auth/forgot-password', { email });
        showToast(data.message, 'success');
        if (data.resetLink) {
          console.log('MOCK LINK CREATED:', data.resetLink);
        }
        switchTab('login');
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    async function initGoogleSignIn() {
      try {
        const config = await api.get('/auth/config');
        if (config.googleClientId) {
          google.accounts.id.initialize({
            client_id: config.googleClientId,
            callback: handleGoogleSignInResponse
          });
          google.accounts.id.renderButton(
            document.getElementById('googleSignInButtonContainer'),
            { theme: 'outline', size: 'large', width: '380' }
          );
        }
      } catch (err) {
        console.error('Failed to initialize Google Sign-In:', err);
      }
    }

    async function handleGoogleSignInResponse(response) {
      try {
        const data = await api.post('/auth/google-token', { token: response.credential });
        api.setTokens(data.accessToken, data.refreshToken);
        auth.setUser(data.user);
        showToast('Logged in with Google successfully', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1000);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    window.addEventListener('load', initGoogleSignIn);

    // Check if user is already authenticated
    if (auth.isAuthenticated()) {
      window.location.href = '/dashboard.html';
    }
  </script>

  <!-- Mock Google Login Modal -->
  <div id="googleModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 400px; padding: 30px; text-align: center; border-radius: var(--border-radius-md);">
      <div style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6-4.53z" fill="#EA4335"/>
        </svg>
        <h2 style="font-size: 1.35rem; font-weight: 600; margin-top: 10px;">Sign in with Google</h2>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Choose an account to continue to Sandro</p>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; text-align: left;">
        <div onclick="auth.loginWithGoogleUser('alice@school.edu', 'AliceCurry')" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); cursor: pointer; transition: var(--transition-smooth); background: transparent;" onmouseover="this.style.background='rgba(99, 102, 241, 0.05)'" onmouseout="this.style.background='transparent'">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #6366f1; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">A</div>
          <div>
            <div style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary);">Alice Curry</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary);">alice@school.edu</div>
          </div>
        </div>
        
        <div onclick="auth.loginWithGoogleUser('bob@school.edu', 'BobMiller')" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); cursor: pointer; transition: var(--transition-smooth); background: transparent;" onmouseover="this.style.background='rgba(99, 102, 241, 0.05)'" onmouseout="this.style.background='transparent'">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #a855f7; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">B</div>
          <div>
            <div style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary);">Bob Miller</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary);">bob@school.edu</div>
          </div>
        </div>

        <div onclick="auth.loginWithGoogleUser('charlie@school.edu', 'CharlieBrown')" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius-sm); cursor: pointer; transition: var(--transition-smooth); background: transparent;" onmouseover="this.style.background='rgba(99, 102, 241, 0.05)'" onmouseout="this.style.background='transparent'">
          <div style="width: 32px; height: 32px; border-radius: 50%; background: #10b981; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">C</div>
          <div>
            <div style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary);">Charlie Brown</div>
            <div style="font-size: 0.75rem; color: var(--text-secondary);">charlie@school.edu</div>
          </div>
        </div>
      </div>

      <button class="btn btn-secondary" onclick="document.getElementById('googleModal').style.display='none'" style="width: 100%;">Cancel</button>
    </div>
  </div>
</body>
</html>
