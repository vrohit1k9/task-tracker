<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Premium Deep Blue-Gray -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Logo Gradient: High-contrast Glowing Gold-Orange -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Drop Shadow Filter for Logo -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.4" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Premium contrasted rounded background card -->
  <rect width="100" height="100" rx="22" fill="url(#bgGradient)" />
  
  <!-- Stylized Hexagon S Logo from your reference image -->
  <g fill="url(#logoGradient)" filter="url(#dropShadow)">
    <!-- Top Half of S -->
    <path d="M 50,16 
             L 80,33.3 
             L 80,60 
             L 68,67 
             L 68,48 
             L 50,38 
             L 32,48 
             L 32,38 
             L 50,28 Z" />
    
    <!-- Bottom Half of S (Rotated 180 degrees around center) -->
    <path d="M 50,16 
             L 80,33.3 
             L 80,60 
             L 68,67 
             L 68,48 
             L 50,38 
             L 32,48 
             L 32,38 
             L 50,28 Z" 
          transform="rotate(180, 50, 50)" />
  </g>
</svg>
