version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/student-task-tracker
      - JWT_SECRET=production_jwt_access_secret_longer_key_32_chars
      - JWT_REFRESH_SECRET=production_jwt_refresh_secret_longer_key_64_chars
    depends_on:
      - db
    restart: always

  db:
    image: mongo:7.0-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
